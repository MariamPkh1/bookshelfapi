spring.application.name=bookshelfapi

# ===== DATABASE =====
# Each value can be overridden with an environment variable; the default after ':' is used otherwise
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bookshelf_db}
spring.datasource.username=${DB_USERNAME:bookshelf_user}
spring.datasource.password=${DB_PASSWORD:password123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / HIBERNATE =====
# Keeps tables and data between restarts; creates them on the first run against an empty database
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Response DTOs read lazy relationships (book tags) in the controllers, so the session stays open for the request
spring.jpa.open-in-view=true
# Uncomment to log every SQL statement
# logging.level.org.hibernate.SQL=DEBUG

# ===== SERVER =====
server.port=8080

# ===== PAGINATION =====
spring.data.web.pageable.max-page-size=100
# Page<T> responses are serialized as { "content": [...], "page": {...} }
spring.data.web.pageable.serialization-mode=via-dto

# ===== FILE UPLOAD =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
file.upload-dir=uploads
